<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作业小助手</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    z-index: 1;
  }
  .login-card {
    background: #fff;
    border-radius: 32px;
    box-shadow: var(--shadow);
    padding: 36px 30px;
    width: 100%;
    max-width: 420px;
    border: 4px solid var(--sky-200);
    text-align: center;
  }
  .login-card .logo-big {
    width: 90px; height: 90px;
    background: linear-gradient(135deg, var(--sky-400), var(--sky-600));
    border-radius: 28px;
    margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 52px;
    box-shadow: var(--shadow);
  }
  .login-card h1 { color: var(--sky-700); font-size: 28px; margin-bottom: 6px; }
  .login-card .sub { color: var(--ink-soft); margin-bottom: 22px; font-size: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; background: var(--sky-100); padding: 6px; border-radius: 16px; }
  .tabs button { flex: 1; border: none; background: transparent; padding: 10px; border-radius: 12px; font-size: 18px; font-weight: bold; color: var(--sky-700); cursor: pointer; font-family: inherit; }
  .tabs button.active { background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .lang-toggle {
    position: absolute; top: 16px; right: 16px;
    background: #fff; border: 2px solid var(--sky-200); border-radius: 14px;
    padding: 6px 12px; font-size: 15px; cursor: pointer; color: var(--sky-700);
    font-family: inherit; font-weight: bold;
  }
</style>
</head>
<body>
  <button class="lang-toggle" id="langBtn">🌐 EN</button>

  <div class="login-wrap">
    <div class="login-card">
      <div class="logo-big">📘</div>
      <h1 data-i18n="appName">作业小助手</h1>
      <p class="sub" data-i18n="slogan">认真写作业，开心拿奖励！</p>

      <div class="tabs">
        <button class="active" data-tab="login" data-i18n="login">登录</button>
        <button data-tab="register" data-i18n="register">注册</button>
      </div>

      <div class="field">
        <label class="label" data-i18n="username">用户名</label>
        <input class="input" id="username" placeholder="👦 请输入用户名" autocomplete="username">
      </div>
      <div class="field">
        <label class="label" data-i18n="password">密码</label>
        <input class="input" id="password" type="password" placeholder="🔒 请输入密码" autocomplete="current-password">
      </div>
      <div class="field" id="confirmField" style="display:none">
        <label class="label" data-i18n="confirmPassword">确认密码</label>
        <input class="input" id="confirmPassword" type="password" placeholder="🔒 再次输入密码">
      </div>

      <button class="btn btn-primary btn-block btn-lg" id="submitBtn" data-i18n="login">登录</button>
      <p style="margin-top:14px;color:var(--ink-soft);font-size:14px">
        💾 账号数据保存在本设备，可跨页面同步
      </p>
    </div>
  </div>

  <!-- 卡通形象 -->
  <div class="mascot" title="点我聊天"><span class="mascot-mouth"></span></div>
  <div class="mascot-bubble"></div>

<script src="js/app.js"></script>
<script>
let mode = "login";

function applyMode() {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === mode));
  document.getElementById("confirmField").style.display = mode === "register" ? "block" : "none";
  document.getElementById("submitBtn").textContent = t(mode);
}
document.querySelectorAll(".tabs button").forEach(b => {
  b.addEventListener("click", () => { mode = b.dataset.tab; applyMode(); playClick(); });
});

document.getElementById("submitBtn").addEventListener("click", () => {
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value;
  if (mode === "register") {
    const cp = document.getElementById("confirmPassword").value;
    if (p !== cp) { toast("两次密码不一致 / Passwords do not match"); return; }
    const r = register(u, p);
    if (r.ok) { playSuccess(); toast("注册成功！/ Registered!"); setTimeout(()=>location.href="calendar.html", 700); }
    else toast(r.msg);
  } else {
    const r = login(u, p);
    if (r.ok) { playSuccess(); toast("登录成功！/ Welcome!"); setTimeout(()=>location.href="calendar.html", 600); }
    else toast(r.msg);
  }
});

// 语言切换
const langBtn = document.getElementById("langBtn");
function refreshLangBtn() { langBtn.textContent = "🌐 " + (currentLang()==="zh" ? "EN" : "中文"); }
langBtn.addEventListener("click", () => { setLang(currentLang()==="zh"?"en":"zh"); refreshLangBtn(); playClick(); });

applyI18n();
refreshLangBtn();
mascotInit();
mascotSay("欢迎使用作业小助手！🎉", 3500);
</script>
</body>
</html>
