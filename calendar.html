<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作业小助手</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .date-nav {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border-radius: 22px; padding: 14px;
    box-shadow: var(--shadow); margin-bottom: 18px;
    border: 3px solid var(--sky-100);
  }
  .date-nav .arrow {
    width: 48px; height: 48px; border-radius: 16px;
    background: var(--sky-100); border: none; font-size: 24px;
    cursor: pointer; color: var(--sky-700); flex-shrink: 0;
  }
  .date-nav .arrow:active { background: var(--sky-200); }
  .date-nav .date-display { flex: 1; text-align: center; }
  .date-nav .date-display .big { font-size: 26px; font-weight: bold; color: var(--sky-700); }
  .date-nav .date-display .week { font-size: 16px; color: var(--ink-soft); }
  .date-nav input[type=date] {
    border: 2px solid var(--sky-200); border-radius: 12px;
    padding: 6px 10px; font-size: 15px; font-family: inherit; color: var(--sky-700);
  }
  .quick-date { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .quick-date button {
    background: #fff; border: 2px solid var(--sky-200); border-radius: 14px;
    padding: 8px 14px; font-size: 15px; cursor: pointer; color: var(--sky-700);
    font-family: inherit; font-weight: bold;
  }
  .quick-date button.active { background: var(--sky-500); color: #fff; border-color: var(--sky-500); }
  .summary { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .summary .stat {
    flex: 1; min-width: 110px; background: #fff; border-radius: 18px;
    padding: 14px; text-align: center; border: 2px solid var(--sky-100);
  }
  .summary .stat .num { font-size: 28px; font-weight: bold; color: var(--sky-600); }
  .summary .stat .lbl { font-size: 14px; color: var(--ink-soft); }
  .add-bar { display: flex; gap: 10px; margin-bottom: 18px; }
  .add-bar .input { flex: 1; }
  .voice-btn {
    width: 56px; height: 56px; border-radius: 18px; border: none;
    background: var(--pink); color: #fff; font-size: 26px; cursor: pointer;
    flex-shrink: 0;
  }
  .voice-btn.recording { background: var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
</style>
</head>
<body>
<header class="app-header"></header>

<main class="container">
  <h2 class="page-title"><span class="emoji">📅</span><span data-i18n="calendar">日历</span></h2>

  <!-- 日期导航 -->
  <div class="date-nav">
    <button class="arrow" id="prevDay">◀️</button>
    <div class="date-display">
      <div class="big" id="dateBig"></div>
      <div class="week" id="dateWeek"></div>
    </div>
    <button class="arrow" id="nextDay">▶️</button>
  </div>

  <div style="text-align:center;margin-bottom:14px">
    <input type="date" id="datePicker">
  </div>

  <div class="quick-date">
    <button data-d="-1" data-i18n="yesterday">昨天</button>
    <button data-d="0" class="active" data-i18n="today">今天</button>
    <button data-d="1" data-i18n="tomorrow">明天</button>
  </div>

  <!-- 概览 -->
  <div class="summary">
    <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">作业总数</div></div>
    <div class="stat"><div class="num" id="statDone">0</div><div class="lbl">已完成</div></div>
    <div class="stat"><div class="num" id="statDoing">0</div><div class="lbl">进行中</div></div>
  </div>

  <!-- 快速新增 + 语音 -->
  <div class="card">
    <div class="card-title">✏️ <span data-i18n="addHomework">新增作业</span></div>
    <div class="add-bar">
      <input class="input" id="quickTitle" placeholder="✍️ 输入作业内容，或点麦克风语音输入..." data-i18n-placeholder="title">
      <button class="voice-btn" id="voiceBtn" title="语音输入">🎤</button>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <select class="select" id="quickSubject" style="flex:1;min-width:120px">
        <option>语文</option><option>数学</option><option>英语</option>
        <option>科学</option><option>美术</option><option>音乐</option>
        <option>体育</option><option>其他</option>
      </select>
      <select class="select" id="quickDiff" style="flex:1;min-width:120px">
        <option value="easy" data-i18n="easy">简单 😊</option>
        <option value="medium" data-i18n="medium">中等 🤔</option>
        <option value="hard" data-i18n="hard">困难 😤</option>
      </select>
    </div>
    <button class="btn btn-primary btn-block" id="quickAdd">➕ <span data-i18n="addHomework">添加作业</span></button>
    <p style="text-align:center;margin-top:10px">
      <a href="add-homework.html" style="color:var(--sky-600);font-size:15px">📝 详细新增作业页面 →</a>
    </p>
  </div>

  <!-- 作业列表 -->
  <div class="card">
    <div class="card-title">📋 <span>作业列表</span></div>
    <div id="hwList"></div>
  </div>
</main>

<!-- 卡通形象 -->
<div class="mascot" title="点我聊天"><span class="mascot-mouth"></span></div>
<div class="mascot-bubble"></div>

<nav class="bottom-nav"></nav>

<script src="js/app.js"></script>
<script>
if (!requireLogin()) throw new Error("not logged in");
initPage("calendar");

let currentDate = todayStr();

function render() {
  const d = new Date(currentDate);
  document.getElementById("dateBig").textContent = fmtDate(currentDate);
  document.getElementById("dateWeek").textContent = weekdayLabel(currentDate);
  document.getElementById("datePicker").value = currentDate;

  document.querySelectorAll(".quick-date button").forEach(b => {
    b.classList.toggle("active", addDays(todayStr(), parseInt(b.dataset.d)) === currentDate);
  });

  const list = getHomeworksByDate(currentDate);
  document.getElementById("statTotal").textContent = list.length;
  document.getElementById("statDone").textContent = list.filter(h=>h.status==="done").length;
  document.getElementById("statDoing").textContent = list.filter(h=>h.status==="doing").length;

  const el = document.getElementById("hwList");
  if (list.length === 0) {
    el.innerHTML = `<div class="empty"><span class="big-emoji">🎉</span>${t("emptyHW")}</div>`;
    return;
  }
  el.innerHTML = list.map(h => `
    <div class="hw-item">
      <div class="hw-icon">${subjectIcon(h.subject)}</div>
      <div class="hw-body">
        <div class="hw-title">${h.title}</div>
        <div class="hw-meta">
          ${diffLabel(h.difficulty)}
          ${statusLabel(h.status)}
          <span>📚 ${h.subject}</span>
        </div>
      </div>
      <div class="hw-actions">
        <button class="btn btn-ghost" style="padding:8px 12px;font-size:14px" onclick="startTimer('${h.id}')">⏱️</button>
        <button class="btn btn-warn" style="padding:8px 12px;font-size:14px" onclick="cycleStatus('${h.id}')">${statusEmoji(h.status)}</button>
        <button class="btn btn-danger" style="padding:8px 12px;font-size:14px" onclick="removeHW('${h.id}')">🗑️</button>
      </div>
    </div>
  `).join("");
}

function statusEmoji(s) { return {todo:"⭕",doing:"▶️",done:"✅"}[s] || "⭕"; }
function cycleStatus(id) {
  const h = getHomeworks().find(x=>x.id===id);
  const next = {todo:"doing",doing:"done",done:"todo"}[h.status];
  updateHomework(id, {status: next});
  if (next === "done") playSuccess(); else playClick();
  render();
}
function removeHW(id) {
  if (!confirm(t("confirmDelete"))) return;
  deleteHomework(id); playClick(); render();
}
function startTimer(id) { location.href = `timer.html?id=${id}`; }

// 日期切换
document.getElementById("prevDay").onclick = () => { currentDate = addDays(currentDate,-1); playClick(); render(); };
document.getElementById("nextDay").onclick = () => { currentDate = addDays(currentDate,1); playClick(); render(); };
document.getElementById("datePicker").onchange = e => { currentDate = e.target.value; render(); };
document.querySelectorAll(".quick-date button").forEach(b => {
  b.onclick = () => { currentDate = addDays(todayStr(), parseInt(b.dataset.d)); playClick(); render(); };
});

// 快速新增
document.getElementById("quickAdd").onclick = () => {
  const title = document.getElementById("quickTitle").value.trim();
  if (!title) { toast("请输入作业内容"); return; }
  addHomework({
    title,
    subject: document.getElementById("quickSubject").value,
    difficulty: document.getElementById("quickDiff").value,
    date: currentDate,
    status: "todo"
  });
  document.getElementById("quickTitle").value = "";
  playSuccess(); toast(t("saved"));
  render();
};

// 语音输入
const voiceBtn = document.getElementById("voiceBtn");
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
if (SpeechRec) {
  recognition = new SpeechRec();
  recognition.lang = currentLang() === "zh" ? "zh-CN" : "en-US";
  recognition.interimResults = false;
  recognition.continuous = false;
  recognition.onresult = e => {
    const txt = e.results[0][0].transcript;
    document.getElementById("quickTitle").value = txt;
    toast("🎤 " + txt);
  };
  recognition.onerror = () => toast("语音识别失败，请重试");
  recognition.onend = () => voiceBtn.classList.remove("recording");
} else {
  voiceBtn.title = "当前浏览器不支持语音输入";
}
voiceBtn.onclick = () => {
  if (!recognition) { toast("当前浏览器不支持语音输入"); return; }
  if (voiceBtn.classList.contains("recording")) { recognition.stop(); return; }
  voiceBtn.classList.add("recording");
  recognition.lang = currentLang() === "zh" ? "zh-CN" : "en-US";
  try { recognition.start(); } catch(e) { voiceBtn.classList.remove("recording"); }
};

// 左右滑动切换日期
let touchX = null;
document.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; });
document.addEventListener("touchend", e => {
  if (touchX == null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) { currentDate = addDays(currentDate, dx > 0 ? -1 : 1); render(); }
  touchX = null;
});

render();
mascotSay("今天也要加油写作业哦！💪", 3000);
</script>
</body>
</html>
